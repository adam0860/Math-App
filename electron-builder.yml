# Windows desktop packaging for C++ Forge (run: npm run dist:win)
appId: com.cppforge.app
productName: C++ Forge
copyright: Copyright © 2026 C++ Forge
directories:
  output: release
  buildResources: build
# The web app is fully bundled by Vite into dist/, so no node_modules are needed
# at runtime (Electron itself is provided by the runtime).
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json
  - '!node_modules/**/*'
asar: true
compression: maximum
# Ship only the English Chromium locale pack (the UI is English).
electronLanguages:
  - en-US
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: CppForge-${version}-${arch}-${os}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: C++ Forge
  artifactName: CppForge-Setup-${version}-${arch}.${ext}
portable:
  artifactName: CppForge-Portable-${version}.${ext}
